name: Android AAB (TWA via Bubblewrap)

# Bouwt een Play-Store-klare .aab van de live PWA.
# Secrets nodig (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64 - base64 van je upload-keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD - wachtwoorden
# Daarna: Actions -> deze workflow -> Run workflow -> download artifact 'aab'.
# Zie store/README.md voor de volledige stappen (en de simpelere PWABuilder-route).

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at the runner's JDK + Android SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > "$HOME/.bubblewrap/config.json"

      - name: Restore signing keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret ontbreekt — zie store/README.md"; exit 1;
          fi
          mkdir -p android-app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android-app/android-keystore.jks
          cp store/twa-manifest.json android-app/twa-manifest.json
          sed -i 's#store/android-keystore.jks#android-keystore.jks#' android-app/twa-manifest.json

      - name: Generate Android project + build signed AAB
        run: |
          cd android-app
          printf '%s\n%s\n' "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            | bubblewrap update --skipVersionUpgrade
          printf '%s\n%s\n' "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            | bubblewrap build

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
