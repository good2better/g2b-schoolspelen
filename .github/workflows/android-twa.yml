name: Android AAB (TWA via Bubblewrap)

# Bouwt een Play-Store-klare .aab van de live PWA.
# Secrets nodig (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64 - base64 van je upload-keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD - wachtwoorden
# Daarna: Actions -> deze workflow -> Run workflow -> download de 'aab' artifact.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Restore signing keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret ontbreekt — zie store/README.md"; exit 1;
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > store/android-keystore.jks

      - name: Init Android project from twa-manifest
        run: |
          mkdir -p android-app
          cd android-app
          bubblewrap init --manifest ../store/twa-manifest.json --directory . <<EOF
          Y
          EOF
          printf '%s\n%s\n' "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_PASSWORD }}" | bubblewrap update --skipVersionUpgrade || true

      - name: Build signed AAB
        run: |
          cd android-app
          printf '%s\n%s\n' "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_PASSWORD }}" | bubblewrap build

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
